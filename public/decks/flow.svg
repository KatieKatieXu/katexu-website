<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <defs>
    <linearGradient id="r1" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#D6E6FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9CC0EE" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0.2" x2="1" y2="0.9">
      <stop offset="0%" stop-color="#EAF3FF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#B9D6F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7FAEE6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="r3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9DFF8" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="b1" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="b2" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b3" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- broad soft sweep -->
  <path d="M980,-60 C700,120 640,420 760,700 C820,840 900,900 980,940 L980,-60 Z"
        fill="url(#r1)" filter="url(#b1)"/>
  <!-- mid ribbon -->
  <path d="M900,-40 C620,160 520,430 660,720 C720,845 820,905 900,940"
        stroke="url(#r2)" stroke-width="150" stroke-linecap="round" filter="url(#b2)" opacity="0.75"/>
  <!-- crisp inner ribbon -->
  <path d="M860,-20 C600,190 520,450 640,700 C700,820 790,880 860,910"
        stroke="url(#r3)" stroke-width="58" stroke-linecap="round" filter="url(#b3)" opacity="0.8"/>
  <!-- thin highlight line -->
  <path d="M812,20 C580,220 520,460 630,690"
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" filter="url(#b3)" opacity="0.7"/>
</svg>
